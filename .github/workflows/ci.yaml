# Publishes two images to ghcr.io/<owner>/<repo> on every GitHub release:
#
#   :<version>, :<major>.<minor>, :latest
#       Current Debian (trixie), for any modern Docker host.
#
#   :<version>-legacy, :<major>.<minor>-legacy, :legacy
#       For the association's server: Docker 19.03 (see DEPLOYMENT.md §3).
#       Debian 11 base (no clone3), Docker v2 media types, a single-platform
#       manifest and no provenance/SBOM attestations — an old daemon chokes on
#       OCI indexes carrying attestation manifests.
#
# Actions are pinned to a commit SHA; the comment gives the version it matches.

name: Publish Docker images

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Build and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The build generates src/lib/paraglide, which svelte-check needs. The env
      # values are the same placeholders the Dockerfile uses: some server modules
      # assert their environment at import time, nothing connects.
      - run: npm run build
        env:
          DATABASE_URL: mysql://build:build@127.0.0.1:3306/build
          S3_URL: https://build.invalid
          S3_ACCESS_KEY_ID: build
          S3_SECRET_ACCESS_KEY: build

      - run: npm run check

  publish:
    name: Publish (${{ matrix.variant }})
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: modern
            debian: trixie
            suffix: ''
            outputs: type=image,push=true
            attestations: true
          - variant: legacy
            debian: bullseye
            suffix: -legacy
            outputs: type=image,push=true,oci-mediatypes=false
            attestations: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Prereleases get only their exact version tag, never latest/legacy.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && matrix.variant == 'modern' }}
            type=raw,value=legacy,suffix=,enable=${{ !github.event.release.prerelease && matrix.variant == 'legacy' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: DEBIAN_RELEASE=${{ matrix.debian }}
          outputs: ${{ matrix.outputs }}
          provenance: ${{ matrix.attestations }}
          sbom: ${{ matrix.attestations }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
