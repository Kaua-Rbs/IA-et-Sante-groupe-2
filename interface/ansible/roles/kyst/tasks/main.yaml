##### Configuration #####
- name: Create project directory
  ansible.builtin.file:
    path: "{{ kyst_project_dir }}"
    state: directory
    owner: podman
    group: podman
    mode: "0755"
  become: true

- name: Copy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ kyst_project_dir }}/compose.yml"
    owner: podman
    group: podman
    mode: "0644"
  register: kyst_compose_file
  become: true

- name: Copy and fill .env file
  ansible.builtin.template:
    src: ias.env.j2
    dest: "{{ kyst_project_dir }}/.env"
    owner: podman
    group: podman
    mode: "0600"
  register: kyst_env_file
  no_log: true
  become: true

##### Démarrage #####
- name: Start KYST services
  ansible.builtin.command:
    cmd: podman-compose up -d --force-recreate
    chdir: "{{ kyst_project_dir }}"
  changed_when: true
  become: true
  become_user: podman

- name: Create demo resources
  ansible.builtin.command:
    cmd: podman exec --workdir /srv kyst-api python -m api.seed
  when: kyst_seed_demo
  register: kyst_seed
  changed_when: "'Demo resources created' in kyst_seed.stdout"
  become: true
  become_user: podman

##### Pare-feu #####
- name: Add firewall rules for KYST services
  ansible.builtin.import_role:
    name: firewall
    tasks_from: create_rule.yml
  vars:
    firewall_rules:
      050-kyst:
        - rule_name: "Allow traffic from the reverse proxy to the KYST front (port 3000)"
          chain: INPUT
          protocol: tcp
          source: "{{ kyst_allowed_source }}"
          destination_port: 3000
          target: ACCEPT
        - rule_name: "Allow traffic from the reverse proxy to pgAdmin (port 3001)"
          chain: INPUT
          protocol: tcp
          source: "{{ kyst_allowed_source }}"
          destination_port: 3001
          target: ACCEPT
