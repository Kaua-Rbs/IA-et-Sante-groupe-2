---
# Dossier du projet compose, dans le home de l'utilisateur rootless
kyst_project_dir: /home/podman/ias
# Session systemd de l'utilisateur podman pour les commandes podman du rôle. Sans elle, conmon
# reste dans la session SSH d'Ansible et meurt avec elle (« conmon exited prematurely »).
kyst_podman_env:
  XDG_RUNTIME_DIR: "/run/user/{{ podman_user.uid }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_user.uid }}/bus"

# Seule machine autorisée à joindre les services exposés (reverse proxy)
kyst_allowed_source: 10.12.2.2/32

# Images publiées par la CI sur ghcr.io à chaque release GitHub. La version est un tag
# d'image : « latest » (dernière release stable), une version exacte (« 1.2.0 ») ou
# « <majeure>.<mineure> » (« 1.2 »).
kyst_image_registry: ghcr.io/kaua-rbs/ia-et-sante-groupe-2
kyst_version: latest
kyst_api_image: "{{ kyst_image_registry }}/api:{{ kyst_version }}"
kyst_app_image: "{{ kyst_image_registry }}/app:{{ kyst_version }}"
# URL publique du front (protection CSRF des formulaires), lue au démarrage du conteneur.
# Vide : le front suppose https et l'en-tête Host transmis par le proxy.
kyst_origin: ""

# Mise à jour automatique (à la manière de Watchtower) : un timer systemd de l'utilisateur
# podman télécharge le tag suivi (kyst_version) et recrée les services dont l'image a changé.
# Sans effet avec une version exacte (« 1.2.0 ») : utile avec « latest » ou « 1.2 ».
kyst_auto_update: true
# Format OnCalendar de systemd ; le délai aléatoire évite de toujours tomber à la même minute
kyst_auto_update_schedule: "*:0/15"
kyst_auto_update_random_delay: 2min
# Services compose suivis et nom de leur conteneur. PostgreSQL et pgAdmin sont exclus :
# une nouvelle version majeure de PostgreSQL demande une migration des données.
kyst_auto_update_services:
  api: kyst-api
  app: kyst-app

kyst_postgres_db: kyst
kyst_postgres_user: kyst
# pgAdmin (port 3001, ouvert au reverse proxy) : pour le débogage, à laisser désactivé en prod
kyst_pgadmin_enabled: false
kyst_pgadmin_email: dummyemail@dummy.org

# Application
kyst_first_admin_email: admin@kyst.fr
kyst_account_validation: true
kyst_access_token_expire_minutes: 30
kyst_refresh_token_expire_days: 7
kyst_auto_replan_enabled: false
kyst_replan_method: SMA x Metaheuristiques
kyst_replan_horizon_days: 14
kyst_replan_budget_seconds: 1
kyst_replan_max_cases: 200
# Modèles entraînés (temps en salle et durée de séjour), non versionnés : ils sont copiés
# depuis la machine de contrôle. Par défaut, les modèles « consultation » de la branche
# improvement/technical-audit, rangés dans artifacts/ml-models/final-2026-10-20-v3/.
# src : chemin relatif à kyst_models_src ; dest : nom attendu par l'API (compose.yml).
kyst_models_src: "{{ playbook_dir }}/../../../artifacts/ml-models"
kyst_model_files:
  - src: final-2026-10-20-v3/room_consultation_selected_2026-10-20_v1.joblib
    dest: surgery_duration_model.joblib
  - src: final-2026-10-20-v3/los_consultation_selected_2026-10-20_v1.joblib
    dest: los_regressor.joblib
# Crée les ressources de démonstration (spécialités, salles, lits, vacations) si la base
# n'en a aucune. À désactiver avant d'y mettre de vraies données.
kyst_seed_demo: true

# Secrets générés au premier déploiement, puis relus à chaque exécution.
# Ils restent sur la machine de contrôle, dans credentials/ (non versionné).
kyst_credentials_dir: "{{ playbook_dir }}/../credentials/{{ inventory_hostname }}/kyst"
kyst_postgres_password: >-
  {{ lookup('ansible.builtin.password', kyst_credentials_dir ~ '/postgres_password',
            length=32, chars=['ascii_letters', 'digits']) }}
kyst_pgadmin_password: >-
  {{ lookup('ansible.builtin.password', kyst_credentials_dir ~ '/pgadmin_password',
            length=32, chars=['ascii_letters', 'digits']) }}
kyst_secret_key: >-
  {{ lookup('ansible.builtin.password', kyst_credentials_dir ~ '/secret_key',
            length=64, chars=['hexdigits']) }}
kyst_first_admin_password: >-
  {{ lookup('ansible.builtin.password', kyst_credentials_dir ~ '/first_admin_password',
            length=20, chars=['ascii_letters', 'digits']) }}
