##### Start services #####
- name: Create project directory
  ansible.builtin.file:
    path: /home/podman/ias
    state: directory
    owner: podman
    group: podman
    mode: "0755"
  become: true

- name: Copy compose file
  ansible.builtin.copy:
    src: paperless/compose.yml
    dest: /home/podman/ias/compose.yml
    owner: podman
    group: podman
    mode: "0644"
  become: true

- name: Copy and fill .env file for
  ansible.builtin.template:
    src: ias.env.j2
    dest: /home/podman/ias/.env
    owner: podman
    group: podman
    mode: "0600"
  become: true

- name: Start app
  ansible.builtin.command:
    cmd: podman-compose up -d --build
    chdir: /home/podman/ias
  become: true
  become_user: podman
  changed_when: true

- name: Add firewall rules for Hestia services
  ansible.builtin.import_role:
    name: firewall
    tasks_from: create_rule.yml
  vars:
    firewall_rules:
      050-equestria:
        - rule_name: "Allow traffic from Equestria to port 3000"
          chain: INPUT
          protocol: tcp
          source: 10.12.2.2/32 # TODO: Source IP should depend on the inventory
          destination_port: 3000 # pgadmin
          target: ACCEPT
        - rule_name: "Allow traffic from Equestria to port 3001"
          chain: INPUT
          protocol: tcp
          source: 10.12.2.2/32
          destination_port: 3001 # pgadmin
          target: ACCEPT
