[project]
name = "kyst-api"
version = "0.1.0"
description = "KYST (Keep Your Surgeries Timely) — API d'orchestration du bloc opératoire et des lits"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.0",
    "sqlmodel>=0.0.47",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "slowapi>=0.1.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# Ce dossier est lui-même le package Python `api` : on ne l'installe pas
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le package `api` s'importe depuis le dossier parent (interface/)
pythonpath = [".."]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
